name: Actualizar Colo-Colo WebCal

on:
  workflow_dispatch:

  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Probar obtención automática
        run: |
          python obtener_fixture.py

      - name: Generar calendario
        run: |
          python actualizar_fixture.py

      - name: Guardar cambios
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add docs/colocolo.ics

          git diff --staged --quiet || git commit -m "Actualización automática calendario Colo-Colo"

          git push
